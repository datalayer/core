name: Orchestration Generated Types

# The checked-in `src/api/orchestration/generated.ts` must be what the
# canonical pydantic models in `datalayer_core/orchestration` say. Those
# models are the source of truth (PLAN_ORCHESTRATOR.md, 19.8), and this is
# the gate that keeps the two languages agreeing: a field added, renamed or
# removed on the Python side fails here until `npm run generate:orchestration`
# is committed.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'datalayer_core/orchestration/**'
      - 'src/api/orchestration/**'
      - 'scripts/generate-orchestration-types.py'
      - '.github/workflows/orchestration-generated-types.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'datalayer_core/orchestration/**'
      - 'src/api/orchestration/**'
      - 'scripts/generate-orchestration-types.py'
      - '.github/workflows/orchestration-generated-types.yml'
  workflow_dispatch:

jobs:
  check-generated:
    # The script also reads the control plane's OpenAPI document, which the
    # private services repository checks in (`services/ai-agents`, `make
    # openapi-orchestration`) and no public deployment serves, so a plain
    # checkout of this repository has nothing to compare against. Set the
    # repository variable `DATALAYER_ORCHESTRATION_OPENAPI_URL` to a URL of
    # that document to turn the check on.
    if: vars.DATALAYER_ORCHESTRATION_OPENAPI_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: '3.12'
          activate-environment: true

      - name: Install datalayer_core
        run: uv pip install .

      - name: Fetch the control plane's OpenAPI document
        env:
          DOCUMENT_URL: ${{ vars.DATALAYER_ORCHESTRATION_OPENAPI_URL }}
        run: curl -fsSL "$DOCUMENT_URL" -o "$RUNNER_TEMP/orchestration-openapi.json"

      - name: Check src/api/orchestration/generated.ts is current
        run: |
          DATALAYER_ORCHESTRATION_OPENAPI="$RUNNER_TEMP/orchestration-openapi.json" \
            python scripts/generate-orchestration-types.py --check
