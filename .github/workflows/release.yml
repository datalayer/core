# Publishes the release a tag names, to PyPI and npm, with no stored token:
# both registries trust this workflow file (OIDC trusted publishing).
# See RELEASE.md.

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check the tag names the version being released
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          npm_version="$(node -p "require('./package.json').version")"
          # hatch reads the Python version from package.json
          # (`[tool.hatch.version] source = "nodejs"`); ask hatch rather than
          # assume it, so a change of source cannot slip past this check.
          python -m pip install --quiet hatch
          py_version="$(hatch version 2>/dev/null | tail -n 1)"
          echo "tag=$tag npm=$npm_version python=$py_version"
          test "$tag" = "$npm_version"
          test "$tag" = "$py_version"

      - name: Install
        run: npm install --workspaces

      # `build` also bundles the CLI login page into datalayer_core/static,
      # which the wheel ships; `build:lib` then re-emits lib/ with the ESM
      # import fixes the npm package needs.
      - name: Build the npm package
        run: |
          npm run build
          npm run build:lib

      - name: Pack the npm package
        run: |
          mkdir -p dist-npm
          npm pack --pack-destination dist-npm

      - name: Build the Python package
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist-py

      - name: Check the wheel carries the built static assets
        run: |
          set -euo pipefail
          wheel="$(ls dist-py/datalayer_core-*.whl)"
          python -m zipfile -l "$wheel" > "$RUNNER_TEMP/wheel-files.txt"
          grep -q 'datalayer_core/static/cli.datalayer-core.js' "$RUNNER_TEMP/wheel-files.txt"
          grep -q 'datalayer_core/static/core.css' "$RUNNER_TEMP/wheel-files.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: dist-npm/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist-py/*

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: dist
      - name: Publish
        run: |
          set -euo pipefail
          for tarball in dist/*.tgz; do
            npm publish "$tarball" --access public --provenance
          done
