[build-system]
requires = [
    "hatchling==1.21.1",
    "hatch-nodejs-version>=0.3.2",
    "hatch-jupyter-builder>=0.5",
    "pip>=26.1.2",
]
build-backend = "hatchling.build"

[project]
name = "datalayer_core"
description="Datalayer Core"
keywords = []
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # The local bridge: X25519 and ChaCha20-Poly1305 for the channel the
    # relay cannot read, and the client that dials the relay.
    "cryptography",
    "datalayer_reactor",
    "httpx",
    "jupyter-console",
    "jupyter-nbmodel-client",
    "jupyter-server>=2.10,<3",
    "keyring",
    "mcp",
    "pydantic-settings",
    "pydantic[email]",
    "pyyaml>=6.0",
    "questionary",
    "requests>=2.33.0",
    "pygments>=2.20.0",
    "rich",
    "traitlets",
    "typer",
    "websockets>=13",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/datalayer/core"
Documentation = "https://core.datalayer.tech"
Repository = "https://github.com/datalayer/core"
Issues = "https://github.com/datalayer/core/issues"
Changelog = "https://github.com/datalayer/core/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "coverage",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest_jupyter",
    "pytest-tornasync",
    "python-dotenv",
    "types-requests",
    "typing-extensions",
    "datamodel-code-generator",
    # So the fsspec filesystem is exercised rather than skipped in CI.
    "fsspec>=2024.6.0",
]
docs = [
    "click>=8.3.1",  # Use latest version, 8.2.2 issue has been fixed
    "npdoc_to_md",
    "pydoc-markdown>=4.0",  # Use modern version with proper module structure
]
examples = [
    "fastapi",
    "pydantic",
    "scikit-learn",
    "streamlit",
    "torch",
    "uvicorn",
]
# `CloudStorage.filesystem()` only. Reading one object needs nothing extra —
# `storage.open(path)` is a plain stream — so a notebook that never asks for
# an fsspec filesystem should not carry fsspec.
fsspec = [
    "fsspec>=2024.6.0",
]
otel = [
    "logfire>=3.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

# The core's command groups, as a reactor CLI extension: any reactor CLI
# host — the `reactor` command itself — picks them up from here. Not under
# `datalayer.cli`: the `datalayer` command hosts that group and adds these
# statically; discovering itself would register everything twice.
[project.entry-points."datalayer.reactor.cli"]
datalayer-core = "datalayer_core.reactor_extension:plugin"

[project.scripts]
d = "datalayer_core.cli.__main__:main"
dla = "datalayer_core.cli.__main__:main"
datalayer = "datalayer_core.cli.__main__:main"
datalayer-config = "datalayer_core.config:main"
datalayer-migrate = "datalayer_core.migrate:main"
datalayer-server = "datalayer_core.serverapplication:main"
datalayer-troubleshoot = "datalayer_core.troubleshoot:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.hooks.version]
path = "datalayer_core/__version.py"

# Build the CLI login browser bundle (datalayer_core/static/cli.datalayer-core.js)
# so it is always present in the packaged sdist/wheel. Without this hook the JS
# asset (which is gitignored) is missing from the wheel and the login page's
# request for /cli.datalayer-core.js returns 404.
[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["datalayer_core/static/cli.datalayer-core.js"]
skip-if-exists = ["datalayer_core/static/cli.datalayer-core.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
path = "."
build_cmd = "build:cli-login"
npm = ["npm"]

[tool.hatch.build.targets.sdist]
artifacts = [
    "datalayer_core/assets/about.md",
    "datalayer_core/templates/*.html",
    "datalayer_core/static/**",
]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel]
artifacts = [
    "datalayer_core/assets/about.md",
    "datalayer_core/templates/*.html",
    "datalayer_core/static/**",
]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"
"jupyter-config/nb-config" = "etc/jupyter/jupyter_notebook_config.d"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.mypy]
follow_imports = "skip"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tornado.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "datalayer_core.handlers.chat.*"
disable_error_code = ["attr-defined"]

# datamodel-codegen output. Its `conint(...)`/`constr(...)` annotations are
# calls, which mypy cannot read as types at all, so every field in the file is
# an error there is no way to fix short of hand-editing generated code.
[[tool.mypy.overrides]]
module = "datalayer_core.models.contents.generated"
ignore_errors = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.poetry]
version = "0.1.0"

[tool.interrogate]
# The gate the pre-commit hook was silently applying was interrogate's own 80%
# default, which this package has never met. Set the bar where the code
# actually stands so it can only be raised from here.
fail-under = 67.0
exclude = ["datalayer_core/tests", "scripts"]

[tool.numpydoc_validation]
checks = [
    "all",   # report on all checks, except the below
    "EX01",  # No examples section found
    "SA01",  # See Also section found
    "ES01",  # No extended summary found
    "GL08",  # The object does not have a docstring
    "PR01",  # Parameters not documented
    "PR02",  # Unknown parameters
    "RT01",  # No Returns section found
]

exclude = [  # don't report on objects that match any of these regex
    '\.undocumented_method$',
    '\.__repr__$',
    '\.test_.*$',
    '\.__init__$',  # Skip __init__ methods
    '\.Config$',  # Skip Pydantic Config classes
]

exclude_files = [ # don't process filepaths that match these regex
    '^test_.*.py$',
]

[tool.pydoc-markdown]
loaders = [
    { type = "python", search_path = ["datalayer_core"] }
]

processors = [
    { type = "filter", skip_empty_modules = false },
    { type = "smart" },
    { type = "crossref" },
    { type = "datalayer_core._pydoc.ReplaceProcessor" }
]

[tool.pydoc-markdown.renderer]
type = "datalayer_core._pydoc.MyDocusaurusRenderer"
docs_base_path = "docs/docs"
relative_output_path = "python_api"
relative_sidebar_path = "sidebar.json"
sidebar_top_level_label = ""

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
    "B101",  # Assert statements are acceptable in this codebase
    "B105",  # Hardcoded password strings - these are configuration keys, not actual passwords
    "B106",  # Hardcoded password funcarg - false positive for empty default values
    "B110",  # Try/except pass is acceptable for error handling
    "B404",  # Subprocess import is needed for legitimate process management
    "B603",  # Subprocess calls are controlled and necessary for CLI operations
    "B606",  # Process execution without shell is safer and intentional
    "B607",  # Partial path execution is acceptable for known binaries
]
