exclude: '^conda.recipe|dev|docs|style|src|jupyter-config|.github|.storybook$'
repos:
  # Basic file checks and formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.8
    hooks:
      # Run the linter
      - id: ruff-check
        args: ['--select', 'I', '--fix']
        types_or: [python, pyi]
        # Generated files: `generate-contents-types.py --check` and
        # `generate-orchestration-types.py --check` compare them byte for byte,
        # so they stay as their generators write them.
        exclude: ^datalayer_core/(models/contents/generated|orchestration/api)\.py$
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi]
        exclude: ^datalayer_core/(models/contents/generated|orchestration/api)\.py$

  # Python docstring validation (NumPy style)
  - repo: https://github.com/numpy/numpydoc
    rev: v1.9.0
    hooks:
      - id: numpydoc-validation
        # `[tool.numpydoc_validation] exclude_files` means to leave the tests
        # out, but this numpydoc's hook has no such option and read nothing.
        exclude: ^datalayer_core/tests/

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']

  # Check for common Python security issues (using pip-audit instead of safety)
  - repo: https://github.com/pypa/pip-audit
    rev: v2.9.0
    hooks:
      - id: pip-audit
        args: ['--ignore-vuln', 'GHSA-4xh5-x5gv-qwph', '--ignore-vuln', 'GHSA-6vgw-5pg2-w6jp', '--ignore-vuln', 'GHSA-5239-wwwm-4pmq', '--ignore-vuln', 'GHSA-gc5v-m9x4-r6x2']

  # Check for large files that shouldn't be committed
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']

  # Python docstring coverage
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [--config=pyproject.toml, --exclude=datalayer_core/tests,
               --exclude=scripts, --exclude=.venv, --exclude=node_modules]
        # Without this pre-commit hands interrogate every Python file by name,
        # and an explicit file list is never filtered by --exclude: the tests
        # and the scripts were being counted whatever the config said.
        pass_filenames: false
